log_format lb '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr rt=$request_time';

server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    access_log /var/log/nginx/access.log lb;

    location / {
        set $backend http://model-serving:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}