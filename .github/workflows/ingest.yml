name: ingest-bmkg
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/data/ingest_data.py
      - run: python src/data/preprocess.py
      - name: Info
        run: echo "Data dikelola DVC, tidak di-commit ke Git. Versioning dilakukan dengan dvc add + dvc push."