services:
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --backend-store-uri sqlite:////mlflow-data/mlflow.db
      --artifacts-destination /mlflow-data/artifacts
      --serve-artifacts
      --allowed-hosts "mlflow-server:5000,localhost:5000,127.0.0.1:5000"
    volumes:
      - mlflow-data:/mlflow-data
    networks:
      - ml-net
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # LK-10: model dibungkus mlflow models build-docker, 3 replika
  model-serving:
    image: rain-risk-serving:latest
    pull_policy: never
    environment:
      MLFLOW_MODELS_WORKERS: "1"
    expose:
      - "8080"
    networks:
      - ml-net
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  # LK-10: load balancer, satu-satunya yang membuka port ke host
  nginx:
    image: nginx:alpine
    depends_on:
      - model-serving
    volumes:
      - ./nginx/lk10.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ml-net
    ports:
      - "8080:80"
    restart: unless-stopped

  # LK-09: hanya jalan dengan: docker compose --profile lk09 up -d --build
  api-service:
    profiles: ["lk09"]
    build: .
    depends_on:
      mlflow-server:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MODEL_URI: models:/rain-risk-classifier@staging
    networks:
      - ml-net
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

networks:
  ml-net:
    driver: bridge

volumes:
  mlflow-data: